[project]
name = "llm-api-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin20AP", email = "apkevin2027@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "celery>=5.6.3",
    "fastapi>=0.161.1",
    "mcp[cli]<2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llm-api-service = "llm_api_service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
